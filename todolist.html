<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
</head>
<body>
    <h1>To Do Listahan</h1>
    <input type = "text"
            id = taskInput
            placeholder = "Add a Trabaho"
            />
            <button onclick="addTask()">dugangi</button>

            <ul id="tasklist"> Imong mga trabaho, diri mabutang.....</ul>

<script>
    function addTask(){
        const taskText = getTaskText();

        if(taskText){
            addTaskItem(taskText);

        }else {
            console.log("dugangi intawn, wala kay gitype");
        }
    }
    
    function getTaskText(){
        const input = document.getElementById('taskInput');
        const text = input.value.trim();

        console.log("getTaskText() called: " + input.value);
        return text;
    }
    function addTaskItem(taskText){
        const li = document.createElement("li");
        li.textContent = taskText;

        document.getElementById("taskList").appendChild(li);
        console.log("addTaskItem() called ->: ", taskText, Date());

        const deleteBtn = createDeleteButton(li);
        li.appendChild(deleteBtn);

        const taskSpan = document.createElement("span");
        taskSpan.textContent = taskText;
        
        const editBtn = createEditButton(li,taskSpan);
        li.appendChild(editBtn);

        const doneBtn = createDoneButton(li,taskSpan);
        li.appendChild(doneBtn);
    }



    function handleDeleteClick(li){
        li.remove();
        console.log("handleDeleteClick")

    }    
    function createEditButton(li, taskSpan){
        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.className = "edit-btn";
        editBtn.style.marginLeft = "8px";
        editBtn.onclick = () => handleEditClick(li);

        console.log("creadeEditButton() called =>", taskSpan.textContent);
        return editBtn;
    }
    function createDoneButtin(){
        const doneBtn = document.createElement("button");
        doneBtn.textContent = "Humana";
        doneBtn.onclick = () => {
            const li = taskSpan.parentElement;

            taskSpan.classlist.add("humana");

            const buttons = li.querySelectorAll("button");
            buttons.forEach(btn=>btn.remove());

            console.log("Task is Humana",taskSpan.textContent, Date());

        }
        return doneBtn;
    }
    
</script>
</body>
</html>
